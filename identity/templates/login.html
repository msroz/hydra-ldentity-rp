<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP | Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card">
        <h1>OP | Login{{ if .ViaRegister }} (Register){{ end }}</h1>
        {{ if .Error }}
            <div class="error-msg">{{ .Error }}</div>
        {{ end }}
        <form action="{{ .Action }}" method="POST">
            {{ .csrfField }}
            <input type="hidden" name="challenge" value="{{ .Challenge }}">
            <label for="login-id">Login ID</label>
            <input type="input" id="login-id" name="login_id" value="{{ if .Hint }}{{ .Hint }}{{ else }}login-id@example.com{{ end }}" placeholder="login-id@example.com">
            <div class="hint">hint: login-id@example.com</div>
            <div class="btn-group">
                <input type="submit" id="accept" name="submit" value="Get code" class="btn btn-primary">
                <input type="submit" id="reject" name="submit" value="Deny access" class="btn btn-danger">
            </div>
        </form>
    </div>
</body>
</html>
