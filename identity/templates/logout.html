<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP | Logout</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card">
        <h1>OP | Logout</h1>
        {{ if .Error }}
            <div class="error-msg">{{ .Error }}</div>
        {{ else }}
            <p>Do you want to logout right now?</p>
        {{ end }}
        <form action="{{ .Action }}" method="POST">
            {{ .csrfField }}
            <input type="hidden" name="_csrf" value="{{ .CsrfToken }}">
            <input type="hidden" name="challenge" value="{{ .Challenge }}">
            <div class="btn-group">
                <input type="submit" id="accept" name="submit" value="Yes" class="btn btn-primary">
                <input type="submit" id="reject" name="submit" value="No" class="btn btn-danger">
            </div>
        </form>
    </div>
</body>
</html>
