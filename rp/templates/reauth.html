<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP | Reauth (ID: {{ .UserID }})</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card">
        <h1>RP | Reauth</h1>
        <p>User ID: <code>{{ .UserID }}</code> / Subject: <code>{{ .Subject }}</code></p>
        <ul class="link-list">
            <li><a href="{{ .PromptLoginURL }}">prompt=login</a></li>
            <li><a href="{{ .PromptLoginWithLoginHintURL }}">prompt=login + login_hint</a></li>
            <li><a href="{{ .PromptLoginWithIDTokenHintURL }}">prompt=login + id_token_hint</a></li>
            <li><a href="{{ .PromptLoginWithBothHintsURL }}">prompt=login + login_hint + id_token_hint</a></li>
        </ul>
    </div>
</body>
</html>
