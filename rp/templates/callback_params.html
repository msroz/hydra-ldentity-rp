<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP | Authorization Response</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .copyable {
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            padding: 2px 8px;
            font-size: 0.7rem;
            background: #e0e0e0;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: #555;
        }
        .copy-btn:hover {
            background: #d0d0d0;
        }
        .copy-btn.copied {
            background: #4caf50;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>RP | Authorization Response</h1>

        {{ if .Error }}
        <h2>error</h2>
        <div class="error-msg">{{ .Error }}</div>

        <h2>error_description</h2>
        <div class="error-msg">{{ .ErrorDescription }}</div>
        {{ end }}

        {{ if .State }}
        <h2>state</h2>
        <div class="token-value copyable" data-copy>{{ .State }}</div>
        {{ end }}

        {{ if .Code }}
        <h2>code</h2>
        <div class="token-value copyable" data-copy>{{ .Code }}</div>

        <h2>scope</h2>
        <div class="token-value">{{ .Scope }}</div>

        <h2>code_verifier (from session)</h2>
        <div class="token-value copyable" data-copy>{{ .CodeVerifier }}</div>

        <form method="POST" action="/token_exchange" style="margin-top: 20px;">
            <input type="hidden" name="code" value="{{ .Code }}">
            <button type="submit" class="btn btn-primary">Execute Token Request</button>
        </form>
        {{ end }}

        <ul class="link-list" style="margin-top:20px;">
            <li><a href="/">Move to Top</a></li>
        </ul>
    </div>
    <script>
        document.querySelectorAll('[data-copy]').forEach(function(el) {
            var btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            btn.addEventListener('click', function() {
                var text = el.textContent.trim();
                navigator.clipboard.writeText(text).then(function() {
                    btn.textContent = 'Copied!';
                    btn.classList.add('copied');
                    setTimeout(function() {
                        btn.textContent = 'Copy';
                        btn.classList.remove('copied');
                    }, 1500);
                });
            });
            el.appendChild(btn);
        });
    </script>
</body>
</html>
